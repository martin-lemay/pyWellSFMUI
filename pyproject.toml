[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "pywellsfmui"
version = "0.1.0"
description = "Web-based interface for the pyWellSFM stratigraphic forward modeling simulator."
authors = [{name = "Martin Lemay", email = "martinlemay@mines-paris.org"}]
license = {file = "LICENSE"}
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "Sedimentology",
    "Stratigraphy",
    "Forward Modeling",
]
requires-python = ">=3.13"
dependencies = [
    "pywellsfm",
    "panel>=1.4",
    "plotly>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff",
    "mypy",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/martin-lemay/pyWellSFMUI"
Documentation = "https://pywellsfmui.readthedocs.io/en/latest/"
Repository = "https://github.com/martin-lemay/pyWellSFMUI.git"

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests/data", "docs/", "*.md"]
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "C4",   # flake8-comprehensions
    "I",    # isort
    "D",    # pydocstyle
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D100",
    "D101",
    "D104",  # Missing docstring in public package
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
console_output_style = "count"
pythonpath = [".", "src"]
python_classes = "Test"
python_files = "test*.py"
python_functions = "test*"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = "."
exclude = "build/*"
warn_unreachable = true
implicit_reexport = true
show_error_codes = true
show_column_numbers = true
disable_error_code = "misc, import-untyped"

[[tool.mypy.overrides]]
module = [
    "docs.*",
    "tests.*",
]
ignore_errors = true
